<svg viewBox="0 0 248 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Axerio Automation">
  <defs>

    <linearGradient id="gLeft" gradientUnits="userSpaceOnUse" x1="6" y1="74" x2="38" y2="6">
      <stop offset="0%"   stop-color="#8096A8"/>
      <stop offset="30%"  stop-color="#C8D8E4"/>
      <stop offset="65%"  stop-color="#F2F8FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="gRight" gradientUnits="userSpaceOnUse" x1="42" y1="6" x2="60" y2="62">
      <stop offset="0%"   stop-color="#5BC8FF"/>
      <stop offset="45%"  stop-color="#1E7FE8"/>
      <stop offset="100%" stop-color="#0A3DA0"/>
    </linearGradient>

    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#3BBFFF"/>
    </linearGradient>

    <linearGradient id="gSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D8E6F2"/>
      <stop offset="45%"  stop-color="#F2F8FF"/>
      <stop offset="100%" stop-color="#8AAFC8"/>
    </linearGradient>

    <filter id="fS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="fB" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <!-- Left bar — silver, long sweep to bottom-left -->
  <line x1="38" y1="6" x2="6" y2="74"
        stroke="url(#gLeft)" stroke-width="13" stroke-linecap="round"
        filter="url(#fS)"/>

  <!-- Right bar — blue, shorter & more vertical, terminates at dot -->
  <line x1="42" y1="6" x2="60" y2="62"
        stroke="url(#gRight)" stroke-width="9" stroke-linecap="round"
        filter="url(#fB)"/>

  <!-- Dot at base of right bar -->
  <circle cx="60" cy="62" r="6" fill="#1E90FF" filter="url(#fB)"/>

  <!-- "a" mark — large, dot sits in upper portion of character -->
  <text x="71" y="68"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="300"
        fill="url(#gBlue)" filter="url(#fB)">a</text>

  <!-- "axerio" wordmark -->
  <text x="106" y="52"
        font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="38" font-weight="200" letter-spacing="2"
        fill="url(#gSilver)" filter="url(#fS)">axerio</text>

  <!-- "automation" subtext -->
  <text x="109" y="68"
        font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="500" letter-spacing="5.8"
        fill="url(#gBlue)">automation</text>

</svg>
