<svg viewBox="0 0 280 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Axerio Automation">
  <defs>

    <!-- Silver — along-stroke gradient for left bar -->
    <linearGradient id="gSilverBar" gradientUnits="userSpaceOnUse" x1="7" y1="63" x2="33" y2="6">
      <stop offset="0%"   stop-color="#5A7A8E"/>
      <stop offset="40%"  stop-color="#C4D8E6"/>
      <stop offset="75%"  stop-color="#E8F2FA"/>
      <stop offset="100%" stop-color="#A0BDD0"/>
    </linearGradient>

    <!-- Blue — along-stroke gradient for right bar -->
    <linearGradient id="gBlueBar" gradientUnits="userSpaceOnUse" x1="35" y1="6" x2="61" y2="63">
      <stop offset="0%"   stop-color="#3BADFF"/>
      <stop offset="40%"  stop-color="#1570D0"/>
      <stop offset="100%" stop-color="#0A3D91"/>
    </linearGradient>

    <!-- Silver wordmark -->
    <linearGradient id="gSilverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D0DFEC"/>
      <stop offset="45%"  stop-color="#EEF6FF"/>
      <stop offset="100%" stop-color="#8AAFC8"/>
    </linearGradient>

    <!-- Blue subtext / "a" -->
    <linearGradient id="gBlueText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#55BBFF"/>
    </linearGradient>

    <!-- Mild glow -->
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Strong glow for dot + "a" -->
    <filter id="fGlowStr" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

  <!-- ═══════════════════════════════════ -->
  <!--  LEFT BAR — silver 3-D cylinder    -->
  <!-- ═══════════════════════════════════ -->

  <!-- Shadow/body -->
  <line x1="33" y1="6" x2="7" y2="63"
        stroke="#3A5060" stroke-width="13" stroke-linecap="round"/>
  <!-- Base silver tone -->
  <line x1="33" y1="6" x2="7" y2="63"
        stroke="url(#gSilverBar)" stroke-width="11" stroke-linecap="round"/>
  <!-- Mid highlight (simulates cylinder curve) -->
  <line x1="33.5" y1="6" x2="7.5" y2="63"
        stroke="rgba(220,238,252,0.65)" stroke-width="5" stroke-linecap="round"/>
  <!-- Specular highlight (bright ridge) -->
  <line x1="34" y1="6" x2="8" y2="63"
        stroke="rgba(255,255,255,0.85)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════ -->
  <!--  RIGHT BAR — blue 3-D cylinder     -->
  <!-- ═══════════════════════════════════ -->

  <!-- Outer glow bloom -->
  <line x1="35" y1="6" x2="61" y2="63"
        stroke="rgba(30,120,255,0.35)" stroke-width="17" stroke-linecap="round"/>
  <!-- Body -->
  <line x1="35" y1="6" x2="61" y2="63"
        stroke="url(#gBlueBar)" stroke-width="11" stroke-linecap="round"/>
  <!-- Inner highlight (left edge of blue cylinder) -->
  <line x1="32.5" y1="7" x2="58.5" y2="64"
        stroke="rgba(100,195,255,0.7)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Specular -->
  <line x1="31.8" y1="7" x2="57.8" y2="64"
        stroke="rgba(180,230,255,0.85)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════ -->
  <!--  BLUE ACCENT DOT                   -->
  <!-- ═══════════════════════════════════ -->
  <circle cx="49" cy="54" r="7"   fill="rgba(20,100,255,0.35)" filter="url(#fGlowStr)"/>
  <circle cx="49" cy="54" r="5"   fill="#1575E8"/>
  <circle cx="49" cy="54" r="3.2" fill="#4BBEFF"/>
  <circle cx="48" cy="53" r="1.2" fill="rgba(255,255,255,0.7)"/>

  <!-- ═══════════════════════════════════ -->
  <!--  SMALL "a"                         -->
  <!-- ═══════════════════════════════════ -->
  <text x="63" y="43"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="300"
        fill="url(#gBlueText)" filter="url(#fGlowStr)">a</text>

  <!-- ═══════════════════════════════════ -->
  <!--  WORDMARK                          -->
  <!-- ═══════════════════════════════════ -->
  <text x="86" y="49"
        font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="38" font-weight="200" letter-spacing="2"
        fill="url(#gSilverText)">axerio</text>

  <text x="89" y="64"
        font-family="'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="5"
        fill="url(#gBlueText)">automation</text>

</svg>
