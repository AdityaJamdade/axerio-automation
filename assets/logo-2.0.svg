<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Axerio Automation">
  <defs>
    <!-- Silver/chrome gradient for left stroke -->
    <linearGradient id="gLeftStroke" gradientUnits="userSpaceOnUse" x1="152" y1="170" x2="202" y2="48">
      <stop offset="0%"   stop-color="#7A8FA6"/>
      <stop offset="40%"  stop-color="#D4DFE8"/>
      <stop offset="70%"  stop-color="#EAF0F6"/>
      <stop offset="100%" stop-color="#A8BCC8"/>
    </linearGradient>

    <!-- Blue gradient for right stroke -->
    <linearGradient id="gRightStroke" gradientUnits="userSpaceOnUse" x1="202" y1="48" x2="258" y2="170">
      <stop offset="0%"   stop-color="#3B9EFF"/>
      <stop offset="50%"  stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Silver gradient for wordmark text -->
    <linearGradient id="gSilverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#D8E4EE"/>
      <stop offset="45%"  stop-color="#EEF4FA"/>
      <stop offset="100%" stop-color="#8FA8BC"/>
    </linearGradient>

    <!-- Blue gradient for AUTOMATION text and small "a" -->
    <linearGradient id="gBlueText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>

    <!-- Soft glow on right (blue) elements -->
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow on silver elements -->
    <filter id="silverGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  ICON MARK: stylised "Aa"                         -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- Left diagonal stroke — silver/chrome, from apex down-left -->
  <line x1="202" y1="50" x2="150" y2="172"
        stroke="url(#gLeftStroke)" stroke-width="18" stroke-linecap="round"
        filter="url(#silverGlow)"/>

  <!-- Right diagonal stroke — blue, from apex down-right -->
  <line x1="206" y1="50" x2="256" y2="172"
        stroke="url(#gRightStroke)" stroke-width="16" stroke-linecap="round"
        filter="url(#blueGlow)"/>

  <!-- Blue accent dot — sits at the base, slightly right of centre -->
  <circle cx="230" cy="162" r="8.5" fill="#1E90FF" filter="url(#blueGlow)"/>

  <!-- Small lowercase "a" — blue, to the upper-right of the mark -->
  <text x="265" y="118"
        font-family="'Helvetica Neue', 'Arial', sans-serif"
        font-size="52" font-weight="200" font-style="normal"
        fill="url(#gBlueText)"
        filter="url(#blueGlow)">a</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!--  WORDMARK                                         -->
  <!-- ══════════════════════════════════════════════════ -->

  <!-- "axerio" — silver, light weight -->
  <text x="210" y="232"
        text-anchor="middle"
        font-family="'Helvetica Neue', 'Gill Sans', 'Segoe UI', Arial, sans-serif"
        font-size="76" font-weight="200" letter-spacing="4"
        fill="url(#gSilverText)"
        filter="url(#silverGlow)">axerio</text>

  <!-- "AUTOMATION" — blue, spaced caps -->
  <text x="210" y="272"
        text-anchor="middle"
        font-family="'Helvetica Neue', 'Gill Sans', 'Segoe UI', Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="12"
        fill="url(#gBlueText)">AUTOMATION</text>
</svg>
